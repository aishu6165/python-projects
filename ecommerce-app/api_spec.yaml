openapi: 3.0.0
info:
  title: E-Commerce API
  description: API documentation for the Orders, Products, and Inventory services.
  version: 1.0.0
servers:
  - url: http://localhost:5005  # Products Service
  - url: http://localhost:5006  # Inventory Service
  - url: http://localhost:5007  # Orders Service

paths:
  /products:
    get:
      summary: Get all products
      responses:
        '200':
          description: A list of products
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                    name:
                      type: string
                    price:
                      type: number
                      format: float
                    in_stock:
                      type: integer

    post:
      summary: Add a new product
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                price:
                  type: number
                  format: float
                in_stock:
                  type: integer
      responses:
        '201':
          description: Product added successfully
        '400':
          description: Bad request

  /products/{id}:
    get:
      summary: Get a product by ID
      parameters:
        - name: id
          in: path
          required: true
          description: The ID of the product
          schema:
            type: integer
      responses:
        '200':
          description: A product object
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  name:
                    type: string
                  price:
                    type: number
                    format: float
                  in_stock:
                    type: integer
        '404':
          description: Product not found

    put:
      summary: Update a product by ID
      parameters:
        - name: id
          in: path
          required: true
          description: The ID of the product
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                price:
                  type: number
                  format: float
                in_stock:
                  type: integer
      responses:
        '200':
          description: Product updated successfully
        '404':
          description: Product not found
        '400':
          description: Bad request

    delete:
      summary: Delete a product by ID
      parameters:
        - name: id
          in: path
          required: true
          description: The ID of the product
          schema:
            type: integer
      responses:
        '200':
          description: Product deleted successfully
        '404':
          description: Product not found


  /inventory:
    post:
      summary: Add a new inventory item
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                product_id:
                  type: integer
                quantity:
                  type: integer
      responses:
        '201':
          description: Inventory added successfully

  /inventory/{product_id}:
    get:
      summary: Get inventory for a product by ID
      parameters:
        - name: product_id
          in: path
          required: true
          description: The ID of the product
          schema:
            type: integer
      responses:
        '200':
          description: An inventory object
          content:
            application/json:
              schema:
                type: object
                properties:
                  product_id:
                    type: integer
                  quantity:
                    type: integer
        '404':
          description: Inventory not found

  /orders:
    post:
      summary: Create a new order
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                product_id:
                  type: integer
                quantity:
                  type: integer
                total_price:
                  type: number
                  format: float
      responses:
        '201':
          description: Order created successfully
        '404':
          description: Product not found or sold out

  /orders/{id}:
    get:
      summary: Get an order by ID
      parameters:
        - name: id
          in: path
          required: true
          description: The ID of the order
          schema:
            type: integer
      responses:
        '200':
          description: An order object
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  product_id:
                    type: integer
                  quantity:
                    type: integer
                  total_price:
                    type: number
                    format: float
                  status:
                    type: string
        '404':
          description: Order not found
